<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Baseline Banana Spectra</title>

  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div>
    <h1>🍌 Baseline Banana Spectra</h1>
    <p>Spectroscopy data processing & visualization</p>
  </div>
  <div class="version">v0.1</div>
</header>

<div class="workspace">

  <aside class="sidebar">

    <section>
      <h3>DATA</h3>

      <label class="upload-button">
        Upload Spectrum
        <input
          type="file"
          id="fileInput"
          accept=".csv,.txt,.dat"
          hidden
        >
      </label>

      <div id="fileName" class="filename">
        No file loaded
      </div>

      <div id="pointCount" class="small-text"></div>
    </section>

    <section>
      <h3>DISPLAY</h3>

      <label class="checkbox-row">
        <input type="checkbox" id="reverseX">
        Reverse X axis
      </label>
    </section>

    <section>
      <h3>BASELINE CORRECTION</h3>

      <label for="baselineMethod">Method</label>

      <select id="baselineMethod">
        <option value="none">None</option>
        <option value="polynomial">Polynomial</option>
      </select>

      <label for="polyDegree">
        Polynomial degree
      </label>

      <select id="polyDegree">
        <option value="1">1 — Linear</option>
        <option value="2" selected>2 — Quadratic</option>
        <option value="3">3 — Cubic</option>
        <option value="4">4 — Quartic</option>
        <option value="5">5 — Quintic</option>
      </select>
    </section>

    <section>
      <h3>NORMALIZATION</h3>

      <select id="normalizeMethod">
        <option value="none">None</option>
        <option value="max">Maximum</option>
        <option value="minmax">Min–Max</option>
        <option value="area">Area</option>
      </select>
    </section>

    <section class="buttons">
      <button id="applyButton" class="primary">
        Apply Processing
      </button>

      <button id="resetButton">
        Reset
      </button>
    </section>

    <section>
      <h3>EXPORT</h3>

      <button id="exportButton">
        Export Processed CSV
      </button>
    </section>

    <section class="privacy">
      🔒 Data processing happens locally in your browser.
    </section>

  </aside>

  <main class="main-panel">

    <div class="plot-header">
      <div>
        <h2>Spectrum</h2>
        <p id="status">
          Upload a spectrum to begin.
        </p>
      </div>
    </div>

    <div id="plot"></div>

  </main>

</div>

<script src="app.js"></script>

</body>
</html>
