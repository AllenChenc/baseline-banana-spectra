<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Baseline Banana Spectra</title>

  <script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffdf4;
      color: #222;
    }

    header {
      background: #ffd84d;
      padding: 22px 40px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 25px;
    }

    .upload-box {
      border: 2px dashed #d5b529;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      background: white;
    }

    input {
      margin-top: 15px;
    }

    #plot {
      width: 100%;
      height: 520px;
      margin-top: 30px;
      background: white;
    }

    .status {
      margin-top: 15px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>🍌 Baseline Banana Spectra</h1>
  <p>Spectroscopy data processing & visualization</p>
</header>

<main>

  <div class="upload-box">

    <h2>Upload Spectrum</h2>

    <p>
      Upload a two-column CSV or TXT file.
    </p>

    <input
      type="file"
      id="fileInput"
      accept=".csv,.txt,.dat"
    >

    <div class="status" id="status">
      No file loaded.
    </div>

  </div>

  <div id="plot"></div>

</main>

<script>

const fileInput = document.getElementById("fileInput");
const status = document.getElementById("status");

fileInput.addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    const text = e.target.result;

    const lines = text
      .split(/\r?\n/)
      .filter(line => line.trim() !== "");

    const x = [];
    const y = [];

    for (const line of lines) {

      const parts = line
        .trim()
        .split(/[\s,;\t]+/);

      if (parts.length < 2) continue;

      const xv = parseFloat(parts[0]);
      const yv = parseFloat(parts[1]);

      if (!isNaN(xv) && !isNaN(yv)) {
        x.push(xv);
        y.push(yv);
      }
    }

    if (x.length === 0) {

      status.textContent =
        "Could not detect numeric two-column data.";

      return;
    }

    status.textContent =
      `${file.name} — ${x.length} data points loaded`;

    Plotly.newPlot(
      "plot",
      [{
        x: x,
        y: y,
        type: "scatter",
        mode: "lines",
        name: "Spectrum"
      }],
      {
        title: "Spectrum",
        xaxis: {
          title: "Wavenumber / Raman Shift"
        },
        yaxis: {
          title: "Intensity"
        },
        margin: {
          t: 60,
          r: 30,
          b: 70,
          l: 80
        }
      },
      {
        responsive: true
      }
    );

  };

  reader.readAsText(file);

});

</script>

</body>
</html>
